<dialog class="search" data-search aria-label="Search posts">
  <form class="search-bar" method="dialog" role="search">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input type="search" placeholder="Search posts, topics, code" autocomplete="off" spellcheck="false" aria-label="Search" data-search-input>
    <button type="button" class="search-close" data-search-close>Esc</button>
  </form>
  <ol class="search-results" data-search-results></ol>
  <p class="search-empty" data-search-empty hidden>No posts match that search. Try a shorter word or a category name.</p>
</dialog>
